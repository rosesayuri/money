<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>金錢觀測站</title>
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC",sans-serif}
    body{display:grid;place-items:center;background:linear-gradient(145deg,#f5f6fb,#ececff);color:#202232;padding:24px}
    .card{width:min(420px,100%);background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.9);border-radius:30px;padding:32px 26px;text-align:center;box-shadow:0 20px 60px rgba(65,56,120,.14);backdrop-filter:blur(18px)}
    .mark{width:68px;height:68px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#7667f5,#5d9df7);color:white;font-size:30px;font-weight:800;box-shadow:0 14px 34px rgba(100,90,220,.28)}
    h1{font-size:24px;margin:0 0 8px}
    p{margin:0;color:#7b7f92;font-size:14px;line-height:1.65}
    .dot{width:9px;height:9px;border-radius:50%;background:#7667f5;margin:22px auto 0;box-shadow:18px 0 #9d91f7,-18px 0 #c9c3ff;animation:pulse .8s ease-in-out infinite alternate}
    @keyframes pulse{from{transform:scale(.8);opacity:.55}to{transform:scale(1.08);opacity:1}}
    @media(prefers-color-scheme:dark){
      body{background:linear-gradient(145deg,#181925,#22243a);color:#f4f4f8}
      .card{background:rgba(35,36,54,.9);border-color:rgba(255,255,255,.08)}
      p{color:#a9adbd}
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => location.replace("https://script.google.com/macros/s/AKfycbw6uOZHCO1amet5MZxHkRYY3k2It7sgWcXFvbTLV0ZCiJC972ebZXyhsLy1Uq6trFdLcg/exec"), 120);
    });
  </script>
</head>
<body>
  <main class="card">
    <div class="mark">✦</div>
    <h1>金錢觀測站</h1>
    <p>正在開啟你的私人財務介面…</p>
    <div class="dot" aria-hidden="true"></div>
    <noscript><p><a href="https://script.google.com/macros/s/AKfycbw6uOZHCO1amet5MZxHkRYY3k2It7sgWcXFvbTLV0ZCiJC972ebZXyhsLy1Uq6trFdLcg/exec">點這裡進入</a></p></noscript>
  </main>
</body>
</html>
